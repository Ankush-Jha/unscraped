<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Reloop - Home</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&amp;family=Space+Grotesk:wght@600;700;800&amp;display=swap"
        rel="stylesheet" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#2eb867",
                        background: "#0a0a0a",
                        surface: "#1a1a1a",
                        nav: "#000000",
                        "surface-highlight": "#262626",
                        "background-light": "#f6f8f7",
                        "background-dark": "#131f18"
                    },
                    fontFamily: {
                        display: "Space Grotesk",
                        body: ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                    boxShadow: {
                        neon: "0 0 20px rgba(16, 185, 129, 0.25)",
                        "purple-glow": "0 0 25px rgba(168, 85, 247, 0.2)"
                    }
                }
            }
        };
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        body {
            background-color: #0a0a0a;
            min-height: max(884px, 100dvh);
        }
    </style>
    <!-- Old Styles (Commented out to prevent conflict) -->
    <!-- <link rel="stylesheet" href="../../css/styles.css"> -->
</head>
<style>
    .stories-section {
        padding: var(--space-2) 0;
        padding-left: var(--space-4);
    }

    /* ========================================
           Compact Scan Card (replaces large camera)
           ======================================== */
    .scan-card-section {
        padding: 0 var(--space-4);
        margin-bottom: var(--space-2);
    }

    .scan-card {
        position: relative;
        background: linear-gradient(135deg, var(--color-surface-dark) 0%, rgba(34, 195, 88, 0.05) 100%);
        border: 2px solid var(--color-border);
        border-radius: var(--radius-xl);
        padding: var(--space-3) var(--space-4);
        cursor: pointer;
        transition: all var(--transition-base);
        overflow: hidden;
    }

    .scan-card:hover {
        border-color: var(--color-primary);
        transform: translateY(-2px);
        box-shadow: 0 8px 32px rgba(34, 195, 88, 0.15);
    }

    .scan-card:active {
        transform: translateY(0) scale(0.99);
    }

    .scan-card::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(34, 195, 88, 0.1), transparent);
        animation: scanCardShimmer 3s ease-in-out infinite;
    }

    @keyframes scanCardShimmer {
        0% {
            transform: translateX(-100%);
        }

        100% {
            transform: translateX(200%);
        }
    }

    .scan-card-content {
        position: relative;
        display: flex;
        align-items: center;
        gap: var(--space-3);
    }

    .scan-card-icon-wrap {
        position: relative;
        width: 56px;
        height: 56px;
        background: linear-gradient(135deg, var(--color-primary) 0%, #1a8a4a 100%);
        border-radius: var(--radius-lg);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 4px 16px rgba(34, 195, 88, 0.3);
    }

    .scan-card-icon-wrap::after {
        content: '';
        position: absolute;
        inset: -4px;
        border: 2px solid var(--color-primary);
        border-radius: calc(var(--radius-xl) + 4px);
        opacity: 0.3;
        animation: scanIconPulse 2s ease-in-out infinite;
    }

    @keyframes scanIconPulse {

        0%,
        100% {
            transform: scale(1);
            opacity: 0.3;
        }

        50% {
            transform: scale(1.1);
            opacity: 0.1;
        }
    }

    .scan-card-icon-wrap .icon {
        font-size: 28px;
        color: #000;
    }

    .scan-card-text {
        flex: 1;
        min-width: 0;
    }

    .scan-card-title {
        font-size: var(--text-lg);
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        line-height: 1;
    }

    .scan-card-subtitle {
        font-size: 11px;
        color: var(--color-text-tertiary);
        line-height: 1.3;
        margin-top: 2px;
    }

    .scan-card-arrow {
        width: 32px;
        height: 32px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: var(--radius-full);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: all var(--transition-base);
    }

    .scan-card:hover .scan-card-arrow {
        background: var(--color-primary);
    }

    .scan-card-arrow .icon {
        font-size: 24px;
        color: var(--color-text-secondary);
        transition: all var(--transition-base);
    }

    .scan-card:hover .scan-card-arrow .icon {
        color: #000;
        transform: translateX(2px);
    }

    /* Upload Button Row */
    .upload-row {
        display: flex;
        gap: var(--space-2);
        margin-top: var(--space-2);
    }

    .upload-btn {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-1);
        padding: var(--space-2);
        background: var(--color-surface-dark);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        font-size: 10px;
        font-weight: 700;
        color: var(--color-text-secondary);
        cursor: pointer;
        transition: all var(--transition-base);
    }

    .upload-btn:hover {
        border-color: var(--color-primary);
        color: var(--color-text-primary);
    }

    .upload-btn .icon {
        font-size: 18px;
    }

    /* ========================================
           Camera Modal (Fullscreen)
           ======================================== */
    .camera-modal {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: var(--color-bg-dark);
        display: none;
        flex-direction: column;
        animation: modalFadeIn 0.3s ease-out;
    }

    .camera-modal.active {
        display: flex;
    }

    @keyframes modalFadeIn {
        from {
            opacity: 0;
            transform: scale(0.95);
        }

        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    .camera-modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--space-4) var(--space-5);
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--color-border);
    }

    .camera-modal-title {
        font-size: var(--text-lg);
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: var(--space-2);
    }

    .camera-modal-title .icon {
        color: var(--color-primary);
    }

    .camera-modal-close {
        width: 40px;
        height: 40px;
        background: var(--color-surface-dark);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-full);
        color: var(--color-text-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all var(--transition-base);
    }

    .camera-modal-close:hover {
        background: var(--color-error);
        border-color: var(--color-error);
    }

    .camera-modal-body {
        flex: 1;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .camera-modal-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .camera-modal-video.front-camera {
        transform: scaleX(-1);
    }

    .camera-modal-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
    }

    .camera-modal-viewfinder {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 80%;
        max-width: 300px;
        aspect-ratio: 1;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: var(--radius-xl);
    }

    .modal-corner {
        position: absolute;
        width: 32px;
        height: 32px;
        border-color: var(--color-primary);
        border-style: solid;
    }

    .modal-corner.tl {
        top: -2px;
        left: -2px;
        border-width: 4px 0 0 4px;
        border-radius: 8px 0 0 0;
    }

    .modal-corner.tr {
        top: -2px;
        right: -2px;
        border-width: 4px 4px 0 0;
        border-radius: 0 8px 0 0;
    }

    .modal-corner.bl {
        bottom: -2px;
        left: -2px;
        border-width: 0 0 4px 4px;
        border-radius: 0 0 0 8px;
    }

    .modal-corner.br {
        bottom: -2px;
        right: -2px;
        border-width: 0 4px 4px 0;
        border-radius: 0 0 8px 0;
    }

    .camera-modal-scan-line {
        position: absolute;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--color-primary);
        box-shadow: 0 0 20px 5px rgba(34, 195, 88, 0.8);
        animation: modalScanLine 2s ease-in-out infinite;
    }

    @keyframes modalScanLine {

        0%,
        100% {
            top: 20%;
            opacity: 0.8;
        }

        50% {
            top: 80%;
            opacity: 1;
        }
    }

    .camera-modal-controls {
        position: absolute;
        top: var(--space-4);
        right: var(--space-4);
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
    }

    .modal-control-btn {
        width: 44px;
        height: 44px;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(10px);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-full);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all var(--transition-base);
    }

    .modal-control-btn:hover {
        background: rgba(0, 0, 0, 0.8);
        border-color: var(--color-primary);
    }

    .modal-control-btn.active {
        background: var(--color-primary);
        color: #000;
    }

    .camera-modal-footer {
        padding: var(--space-5);
        padding-bottom: calc(var(--space-8) + env(safe-area-inset-bottom));
        background: linear-gradient(to top, rgba(0, 0, 0, 0.95), rgba(0, 0, 0, 0.8));
    }

    .modal-capture-btn {
        width: 100%;
        height: 64px;
        background: var(--color-primary);
        border: none;
        border-radius: var(--radius-xl);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-3);
        cursor: pointer;
        transition: all var(--transition-base);
        box-shadow: 0 0 30px rgba(34, 195, 88, 0.4);
    }

    .modal-capture-btn:hover {
        filter: brightness(1.1);
        transform: scale(1.02);
    }

    .modal-capture-btn:active {
        transform: scale(0.98);
    }

    .modal-capture-btn .icon {
        font-size: 28px;
        color: #000;
    }

    .modal-capture-btn span:last-child {
        font-size: var(--text-lg);
        font-weight: 900;
        color: #000;
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }

    .modal-upload-link {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        margin-top: var(--space-4);
        font-size: var(--text-sm);
        font-weight: 600;
        color: var(--color-text-muted);
        cursor: pointer;
        transition: color var(--transition-base);
    }

    .modal-upload-link:hover {
        color: var(--color-text-primary);
    }

    /* Quick Actions - Compact */
    .quick-actions {
        padding: 0 var(--space-4);
        margin-bottom: var(--space-2);
    }

    .quick-actions-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--space-2);
    }

    .quick-action-card {
        background: var(--color-surface-card);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        padding: var(--space-3);
        text-align: center;
        cursor: pointer;
        transition: all var(--transition-base);
        text-decoration: none;
        color: inherit;
    }

    .quick-action-card:hover {
        border-color: var(--color-primary);
        transform: translateY(-2px);
    }

    .quick-action-icon {
        font-size: 24px;
        margin-bottom: var(--space-1);
        color: var(--color-primary);
    }

    .quick-action-label {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--color-text-secondary);
    }

    /* ========================================
           Leaderboard Snippet Card
           ======================================== */
    .leaderboard-snippet {
        padding: 0 var(--space-4);
        padding-bottom: var(--space-4);
    }

    .leaderboard-card {
        background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
        border: 2px solid #FFD23F;
        border-radius: var(--radius-2xl);
        overflow: hidden;
        cursor: pointer;
        transition: all var(--transition-base);
        text-decoration: none;
        display: block;
        color: inherit;
        position: relative;
    }

    .leaderboard-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 32px rgba(255, 210, 63, 0.2);
    }

    .leaderboard-card::before {
        content: '';
        position: absolute;
        top: 0;
        right: 0;
        width: 100px;
        height: 100%;
        background: linear-gradient(to left, rgba(255, 210, 63, 0.1), transparent);
    }

    .leaderboard-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--space-3) var(--space-4);
        border-bottom: 1px solid rgba(255, 210, 63, 0.2);
    }

    .leaderboard-card-title {
        display: flex;
        align-items: center;
        gap: var(--space-2);
    }

    .leaderboard-card-title .icon {
        font-size: 20px;
        color: #FFD23F;
    }

    .leaderboard-card-title span:last-child {
        font-size: var(--text-sm);
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #FFD23F;
    }

    .leaderboard-card-action {
        display: flex;
        align-items: center;
        gap: var(--space-1);
        font-size: var(--text-xs);
        font-weight: 700;
        color: var(--color-text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .leaderboard-card-action .icon {
        font-size: 16px;
        transition: transform var(--transition-base);
    }

    .leaderboard-card:hover .leaderboard-card-action .icon {
        transform: translateX(3px);
    }

    .leaderboard-list-snippet {
        padding: var(--space-3) var(--space-4);
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
    }

    .leaderboard-row {
        display: flex;
        align-items: center;
        padding: var(--space-2);
        background: rgba(255, 255, 255, 0.03);
        border-radius: var(--radius-lg);
        transition: background var(--transition-base);
    }

    .leaderboard-row:hover {
        background: rgba(255, 255, 255, 0.06);
    }

    .leaderboard-row.highlight {
        background: linear-gradient(135deg, rgba(34, 195, 88, 0.1), rgba(34, 195, 88, 0.05));
        border: 1px solid rgba(34, 195, 88, 0.3);
    }

    .lb-rank {
        width: 24px;
        height: 24px;
        background: linear-gradient(135deg, #FFD23F 0%, #FFB300 100%);
        border-radius: var(--radius-full);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 900;
        color: #000;
        margin-right: var(--space-2);
        flex-shrink: 0;
    }

    .lb-rank.you {
        background: var(--color-primary);
    }

    .lb-avatar {
        width: 32px;
        height: 32px;
        border-radius: var(--radius-md);
        overflow: hidden;
        margin-right: var(--space-2);
        flex-shrink: 0;
        border: 1px solid rgba(255, 210, 63, 0.3);
    }

    .lb-avatar.you {
        border-color: var(--color-primary);
    }

    .lb-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .lb-info {
        flex: 1;
        min-width: 0;
    }

    .lb-name {
        font-size: var(--text-sm);
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .lb-name.you {
        color: var(--color-primary);
    }

    .lb-dept {
        font-size: 9px;
        color: var(--color-text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .lb-points {
        font-family: monospace;
        font-size: var(--text-sm);
        font-weight: 700;
        color: #FFD23F;
    }

    .lb-points.you {
        color: var(--color-primary);
    }

    .leaderboard-your-rank {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--space-3) var(--space-4);
        background: var(--color-primary);
        margin-top: var(--space-2);
    }

    .your-rank-info {
        display: flex;
        align-items: center;
        gap: var(--space-3);
    }

    .your-rank-badge {
        width: 36px;
        height: 36px;
        background: #000;
        border-radius: var(--radius-full);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: var(--text-sm);
        font-weight: 900;
        color: var(--color-primary);
    }

    .your-rank-text {
        display: flex;
        flex-direction: column;
    }

    .your-rank-label {
        font-size: var(--text-lg);
        font-weight: 900;
        color: #000;
        text-transform: uppercase;
    }

    .your-rank-motivate {
        font-size: 10px;
        font-weight: 700;
        color: rgba(0, 0, 0, 0.7);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .your-rank-points {
        text-align: right;
    }

    .your-rank-pts-label {
        font-size: 9px;
        font-weight: 700;
        color: rgba(0, 0, 0, 0.6);
        text-transform: uppercase;
    }

    .your-rank-pts-value {
        font-family: monospace;
        font-size: var(--text-xl);
        font-weight: 900;
        color: #000;
    }

    /* Hidden elements */
    #file-upload,
    #capture-canvas {
        display: none;
    }

    /* ========================================
           Progress Ribbon Navbar - Animated
           ======================================== */
    .progress-ribbon {
        position: sticky;
        top: 64px;
        z-index: 25;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.85) 100%);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--color-border);
        padding: var(--space-3) var(--space-4);
        overflow: hidden;
    }

    .progress-ribbon::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg,
                transparent 0%,
                rgba(34, 195, 88, 0.03) 50%,
                transparent 100%);
        animation: shimmer 3s ease-in-out infinite;
    }

    @keyframes shimmer {

        0%,
        100% {
            opacity: 0.5;
            transform: translateX(-100%);
        }

        50% {
            opacity: 1;
            transform: translateX(100%);
        }
    }

    .progress-ribbon-inner {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
    }

    /* XP Section */
    .xp-section {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        text-decoration: none;
        color: inherit;
        padding: var(--space-2);
        margin: calc(var(--space-2) * -1);
        border-radius: var(--radius-lg);
        transition: all var(--transition-base);
    }

    .xp-section:hover {
        background: rgba(255, 255, 255, 0.05);
    }

    .xp-info {
        flex-shrink: 0;
    }

    .xp-level {
        display: flex;
        align-items: center;
        gap: var(--space-2);
    }

    .level-badge {
        background: linear-gradient(135deg, var(--color-primary) 0%, #1a8a4a 100%);
        color: #000;
        font-size: 10px;
        font-weight: 900;
        padding: 4px 8px;
        border-radius: var(--radius-md);
        letter-spacing: 0.05em;
        box-shadow: 0 2px 8px rgba(34, 195, 88, 0.3);
        animation: levelPulse 2s ease-in-out infinite;
    }

    @keyframes levelPulse {

        0%,
        100% {
            box-shadow: 0 2px 8px rgba(34, 195, 88, 0.3);
        }

        50% {
            box-shadow: 0 2px 16px rgba(34, 195, 88, 0.5);
        }
    }

    .xp-text {
        font-size: 11px;
        font-weight: 600;
        color: var(--color-text-tertiary);
        letter-spacing: 0.02em;
    }

    .xp-bar-container {
        flex: 1;
        min-width: 0;
    }

    .xp-bar {
        position: relative;
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: var(--radius-full);
        overflow: hidden;
    }

    .xp-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--color-primary) 0%, #4ade80 100%);
        border-radius: var(--radius-full);
        position: relative;
        transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .xp-bar-fill::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.4) 50%,
                transparent 100%);
        animation: xpShine 2s ease-in-out infinite;
    }

    @keyframes xpShine {
        0% {
            transform: translateX(-100%);
        }

        100% {
            transform: translateX(200%);
        }
    }

    .xp-bar-glow {
        position: absolute;
        top: -2px;
        bottom: -2px;
        left: 0;
        width: 82%;
        background: var(--color-primary);
        filter: blur(8px);
        opacity: 0.3;
        border-radius: var(--radius-full);
    }

    /* Progress Action Pills */
    .progress-actions {
        display: flex;
        gap: var(--space-2);
        overflow-x: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
        padding: 2px 0;
    }

    .progress-actions::-webkit-scrollbar {
        display: none;
    }

    .progress-pill {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-2) var(--space-3);
        background: var(--color-surface-dark);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-xl);
        text-decoration: none;
        color: inherit;
        transition: all var(--transition-base);
        position: relative;
        overflow: hidden;
    }

    .progress-pill::before {
        content: '';
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity var(--transition-base);
    }

    .progress-pill:hover {
        transform: translateY(-2px);
        border-color: transparent;
    }

    .progress-pill:active {
        transform: translateY(0) scale(0.98);
    }

    /* Ranking Pill */
    .ranking-pill::before {
        background: linear-gradient(135deg, rgba(255, 210, 63, 0.15) 0%, transparent 60%);
    }

    .ranking-pill:hover {
        border-color: rgba(255, 210, 63, 0.5);
        box-shadow: 0 4px 20px rgba(255, 210, 63, 0.2);
    }

    .ranking-pill:hover::before {
        opacity: 1;
    }

    .ranking-pill .icon {
        color: #FFD23F;
    }

    /* Missions Pill */
    .missions-pill::before {
        background: linear-gradient(135deg, rgba(34, 195, 88, 0.15) 0%, transparent 60%);
    }

    .missions-pill:hover {
        border-color: rgba(34, 195, 88, 0.5);
        box-shadow: 0 4px 20px rgba(34, 195, 88, 0.2);
    }

    .missions-pill:hover::before {
        opacity: 1;
    }

    .missions-pill .icon {
        color: var(--color-primary);
    }

    /* Badges Pill */
    .badges-pill::before {
        background: linear-gradient(135deg, rgba(186, 104, 200, 0.15) 0%, transparent 60%);
    }

    .badges-pill:hover {
        border-color: rgba(186, 104, 200, 0.5);
        box-shadow: 0 4px 20px rgba(186, 104, 200, 0.2);
    }

    .badges-pill:hover::before {
        opacity: 1;
    }

    .badges-pill .icon {
        color: #BA68C8;
    }

    .pill-icon-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        flex-shrink: 0;
    }

    .pill-icon-wrap .icon {
        font-size: 20px;
        transition: transform var(--transition-base);
    }

    .progress-pill:hover .pill-icon-wrap .icon {
        transform: scale(1.15);
    }

    /* Pulse ring animation for ranking */
    .pulse-ring {
        position: absolute;
        inset: -4px;
        border: 2px solid rgba(255, 210, 63, 0.4);
        border-radius: 50%;
        animation: pulseRing 2s ease-out infinite;
    }

    @keyframes pulseRing {
        0% {
            transform: scale(0.8);
            opacity: 1;
        }

        100% {
            transform: scale(1.4);
            opacity: 0;
        }
    }

    /* Notification dot for missions */
    .notification-dot {
        position: absolute;
        top: -2px;
        right: -2px;
        min-width: 16px;
        height: 16px;
        background: #ef4444;
        border-radius: var(--radius-full);
        font-size: 9px;
        font-weight: 700;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 4px;
        animation: notifBounce 2s ease-in-out infinite;
        box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4);
    }

    @keyframes notifBounce {

        0%,
        100% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.1);
        }
    }

    .pill-content {
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
        flex: 1;
    }

    .pill-label {
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--color-text-muted);
    }

    .pill-value {
        font-size: 13px;
        font-weight: 800;
        color: var(--color-text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .arrow-icon {
        font-size: 18px;
        color: var(--color-text-muted);
        flex-shrink: 0;
        transition: all var(--transition-base);
        opacity: 0.5;
    }

    .progress-pill:hover .arrow-icon {
        opacity: 1;
        transform: translateX(2px);
        color: var(--color-text-primary);
    }

    /* Responsive adjustments */
    @media (max-width: 380px) {
        .progress-actions {
            gap: var(--space-1);
        }

        .progress-pill {
            padding: var(--space-2);
        }

        .pill-content {
            display: none;
        }

        .arrow-icon {
            display: none;
        }

        .pill-icon-wrap {
            width: 36px;
            height: 36px;
        }

        .pill-icon-wrap .icon {
            font-size: 22px;
        }
    }
</style>

        async function updateLeaderboardSnippet() {
            const listEl = document.querySelector('.leaderboard-list-snippet');
            if (!listEl) return;

            // HARDCODED MVP LEADERBOARD (Top 5)
            const squad = [
                { name: 'Ankush Jha', xp: 15400, rank: 1, avatar: 'https://ui-avatars.com/api/?name=Ankush+Jha&background=22c358&color=fff' },
                { name: 'Unnati Asthana', xp: 13500, rank: 2, avatar: 'https://ui-avatars.com/api/?name=Unnati+Asthana&background=random&color=fff' },
                { name: 'Uransh', xp: 11200, rank: 3, avatar: 'https://ui-avatars.com/api/?name=Uransh&background=random&color=fff' },
                { name: 'Rudrakh Bairagi', xp: 9800, rank: 4, avatar: 'https://ui-avatars.com/api/?name=Rudrakh+Bairagi&background=random&color=fff' },
                { name: 'GreenQueen', xp: 8500, rank: 5, avatar: 'https://ui-avatars.com/api/?name=Green+Queen&background=random&color=fff' },

            let html = '';
            squad.forEach(user => {

                html += `
                    <div class="leaderboard-row ${isYou ? 'highlight' : ''}">
                        <div class="lb-rank ${isYou ? 'you' : ''}">#${user.rank}</div>

                    </div>
                `;
            });

            listEl.innerHTML = html;

        // Load Leaderboard Snippet
        async function loadLeaderboardSnippet(currentUserId) {
            try {
                if (typeof GamificationService === 'undefined') return;

                // Get top 3
                const leaderboard = await GamificationService.getLeaderboard('xp', 3);
                const container = document.getElementById('leaderboard-preview-list');

                if (container) {
                    if (leaderboard.length > 0) {
                        container.innerHTML = leaderboard.map((entry, index) => {
                            return `
                                <div class="leaderboard-row ${entry.id === currentUserId ? 'highlight' : ''}">
                                    <div class="lb-rank ${entry.id === currentUserId ? 'you' : ''}">${entry.rank}</div>
                                    <div class="lb-avatar ${entry.id === currentUserId ? 'you' : ''}">

                                    </div>
                                    <div class="lb-info">
                                        <div class="lb-name ${entry.id === currentUserId ? 'you' : ''}">${entry.name}${entry.id === currentUserId ? ' (You)' : ''}</div>
                                        <div class="lb-dept">${entry.levelTitle || 'Rookie'}</div>
                                    </div>
                                    <div class="lb-points ${entry.id === currentUserId ? 'you' : ''}">${entry.xp || 0} XP</div>
                                </div>
                            `;
                        }).join('');
                    } else {
                        container.innerHTML = `
                            <div class="leaderboard-row" style="justify-content: center; padding: 20px; color: var(--color-text-muted);">
                                No rankings yet. Be the first!
                            </div>
                        `;
                    }
                }

                // Get User Rank
                const rankData = await GamificationService.getUserRank(currentUserId, 'xp');
                const rankBadge = document.getElementById('user-rank-badge');
                const rankPoints = document.getElementById('user-rank-points');

                if (rankBadge) rankBadge.textContent = rankData.rank > 0 ? rankData.rank : '-';
                // Show total XP points in the YOUR RANK section
                if (rankPoints) {
                    // Need to get user's XP. If we already fetched user in loadUserGreeting, we could pass it.
                    // But let's just re-fetch or assume consistent data.
                    // The rankData object likely contains the user's xp or we can wait for the userDoc.
                    // Let's use what we know.
                    // Wait, we can get it from the earlier fetch if we pass it, but simpler to just fetch or use DOM if we set it earlier.
                    // Let's check GamificationService.getUserRank return type. It returns { rank: number, ...userStats }.
                    // Wait, let's verify getUserRank signature. 
                    // It is: getUserRank(userId, sortBy = 'xp')
                    // Checking gamification.js file again...
                    // const userDoc = await db.collection('users').doc(userId).get();
                    // const userData = userDoc.data();
                    // ...
                    // return { rank: rank + 1, ...userData };

                    if (rankData) {
                        const xp = rankData.xp || 0;
                        rankPoints.textContent = xp >= 1000 ? (xp / 1000).toFixed(1) + 'k' : xp;
                    }
                }

            } catch (error) {
                console.error('Error loading leaderboard snippet:', error);
            }
        }

        // Load on auth
        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                loadUserGreeting();
            }
        });
    </script>

            modal.classList.remove('active');
            cameraModalOpen = false;
            document.body.style.overflow = ''; // Restore scroll

            // Stop camera when closing
            if (window.reloopScanner && cameraStarted) {
                window.reloopScanner.stopCamera();
                cameraStarted = false;
            }
        }

        // Start camera
        async function startCamera() {
            try {
                const video = document.getElementById('camera-video');

                // Try to start camera
                await window.reloopScanner.startCamera();
                cameraStarted = true;
                showToast('Camera ready', 'success');

            } catch (error) {
                console.error('Camera start error:', error);
                showToast('Camera access denied. Please enable camera permissions.', 'error');
            }
        }

        // Setup modal controls
        function setupModalControls() {
            // Toggle camera (front/back)
            document.getElementById('modal-flip-btn')?.addEventListener('click', async (e) => {
                e.stopPropagation();
                if (cameraStarted) {
                    await window.reloopScanner.toggleCamera();
                    const video = document.getElementById('camera-video');
                    video.classList.toggle('front-camera', window.reloopScanner.facingMode === 'user');
                    showToast('Camera switched', 'success');
                }
            });

            // Toggle flash (if supported)
            document.getElementById('modal-flash-btn')?.addEventListener('click', async (e) => {
                e.stopPropagation();
                flashOn = !flashOn;
                const flashBtn = document.getElementById('modal-flash-btn');
                const icon = flashBtn.querySelector('.material-symbols-outlined');

                if (flashOn) {
                    icon.textContent = 'flash_on';
                    flashBtn.classList.add('active');

                    // Try to enable flash
                    if (window.reloopScanner.stream) {
                        const track = window.reloopScanner.stream.getVideoTracks()[0];
                        const capabilities = track.getCapabilities?.();
                        if (capabilities?.torch) {
                            await track.applyConstraints({ advanced: [{ torch: true }] });
                        }
                    }
                } else {
                    icon.textContent = 'flash_off';
                    flashBtn.classList.remove('active');

                    // Turn off flash
                    if (window.reloopScanner.stream) {
                        const track = window.reloopScanner.stream.getVideoTracks()[0];
                        const capabilities = track.getCapabilities?.();
                        if (capabilities?.torch) {
                            await track.applyConstraints({ advanced: [{ torch: false }] });
                        }
                    }
                }
            });

            // Close modal on escape key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && cameraModalOpen) {
                    closeCameraModal();
                }
            });
        }

        // Perform scan using Hugging Face AI
        async function performScan() {
            // Start camera if not started
            if (!cameraStarted) {
                await startCamera();
                await new Promise(resolve => setTimeout(resolve, 1000));
            }

            // Show scanning overlay
            const overlay = showScanningOverlay();

            try {
                // Capture frame from video
                const video = document.getElementById('camera-video');
                const canvas = document.getElementById('capture-canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const imageBase64 = canvas.toDataURL('image/jpeg', 0.8);

                // Use AIScannerService (Hugging Face) for analysis
                if (typeof AIScannerService !== 'undefined') {
                    const result = await AIScannerService.analyzeImage(imageBase64);
                    if (result.success) {
                        // Add captured image to result
                        result.item.capturedImage = imageBase64;
                        AIScannerService.storeResult(result.item);
                        closeCameraModal();
                        window.location.href = '../scanner/result-dynamic.html';
                    } else {
                        throw new Error(result.error || 'Analysis failed');
                    }
                } else {
                    throw new Error('Scanner service not loaded');
                }

            } catch (error) {
                console.error('Scan error:', error);
                hideScanningOverlay();
                showToast(error.message || 'Scan failed. Please try again.', 'error');
            }
        }

        // Handle file upload - Uses real AI scanning
        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Close modal if open
            if (cameraModalOpen) {
                closeCameraModal();
            }

            // Show loading
            const overlay = showScanningOverlay();

            try {
                // Read file as base64
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        // Use AIScannerService for analysis
                        if (typeof AIScannerService !== 'undefined') {
                            const result = await AIScannerService.analyzeImage(e.target.result);
                            if (result.success) {
                                // Add captured image to result
                                result.item.capturedImage = e.target.result;
                                AIScannerService.storeResult(result.item);
                                window.location.href = '../scanner/result-dynamic.html';
                            } else {
                                throw new Error(result.error || 'Analysis failed');
                            }
                        } else {
                            // Fallback to scanning animation
                            window.location.href = '../scanner/scanning.html';
                        }
                    } catch (err) {
                        console.error('Scan error:', err);
                        hideScanningOverlay();
                        showToast('Failed to analyze image. Please try again.', 'error');
                    }
                };
                reader.readAsDataURL(file);
            } catch (error) {
                console.error('Upload error:', error);
                hideScanningOverlay();
                showToast('Failed to upload image.', 'error');
            }

            // Reset file input
            event.target.value = '';
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (window.reloopScanner) {
                window.reloopScanner.stopCamera();
            }
        });
    </script>

            loadUserGreeting();

        // Disable standard listeners
        firebase.auth().onAuthStateChanged(user => {
